spring.application.name=followup

# Database Supabase
spring.datasource.url=jdbc:postgresql://aws-0-eu-west-1.pooler.supabase.com:5432/postgres?user=postgres.haxthlwuxlxztgitcgdd&password=${DB_PASSWORD:gruppoautoscalafollowup}&sslmode=require
spring.datasource.username=postgres.haxthlwuxlxztgitcgdd
spring.datasource.password=${DB_PASSWORD:gruppoautoscalafollowup}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Porta
server.port=${PORT:8080}

# Sessione utente: prima non era impostata da nessuna parte, quindi usava
# il default di Spring Boot (30 minuti di inattivita', cookie che sparisce
# alla chiusura del browser). Ora dura 30 giorni e il cookie resta valido
# anche dopo aver chiuso il browser, cosi' l'accesso resta "ricordato"
# come ci si aspetta da uno strumento interno.
server.servlet.session.timeout=30d
server.servlet.session.cookie.max-age=2592000

# Email — invio notifiche allert (Registro Contatti). Server SMTP di Aruba
# (posta aziendale ospitata su Aruba). MAIL_USERNAME e MAIL_PASSWORD vanno
# impostate come variabili d'ambiente su Railway (mai scritte qui in
# chiaro): username e' l'indirizzo email completo
# (giuseppe.palladino@gruppoautoscala.com), password e' quella con cui si
# accede a webmail.aruba.it (NON quella del CRM).
spring.mail.host=smtps.aruba.it
spring.mail.port=465
spring.mail.username=giuseppe.palladino@gruppoautoscala.com
spring.mail.password=BDC@GNano2026_
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtps.aruba.it

# Indirizzo mittente mostrato nelle mail — di default lo stesso account
