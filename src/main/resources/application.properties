spring.application.name=followup

# Database Supabase
spring.datasource.url=jdbc:postgresql://aws-0-eu-west-1.pooler.supabase.com:5432/postgres?user=postgres.haxthlwuxlxztgitcgdd&password=${DB_PASSWORD:gruppoautoscalafollowup}&sslmode=require
spring.datasource.username=postgres.haxthlwuxlxztgitcgdd
spring.datasource.password=${DB_PASSWORD:gruppoautoscalafollowup}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Porta
server.port=${PORT:8080}

# Sessione utente: prima non era impostata da nessuna parte, quindi usava
# il default di Spring Boot (30 minuti di inattivita', cookie che sparisce
# alla chiusura del browser). Ora dura 30 giorni e il cookie resta valido
# anche dopo aver chiuso il browser, cosi' l'accesso resta "ricordato"
# come ci si aspetta da uno strumento interno.
server.servlet.session.timeout=30d
server.servlet.session.cookie.max-age=2592000